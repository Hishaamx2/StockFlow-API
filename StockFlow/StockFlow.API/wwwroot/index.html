<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StockFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="logo.svg" alt="StockFlow logo" id="site-logo">
        <h1>StockFlow</h1>
    </header>

    <main>
        <section id="login-section">
            <div id="auth-tabs">
                <button id="login-tab" class="auth-tab active">Login</button>
                <button id="register-tab" class="auth-tab">Register</button>
            </div>
            <input type="text" id="username-input" placeholder="Username">
            <input type="password" id="password-input" placeholder="Password">
            <button id="auth-submit-button">Log In</button>
            <p id="login-status"></p>
        </section>

        <section id="inventory-section">
            <h2>Inventory</h2>
            <div id="inventory-container">Loading inventory...</div>
        </section>

        <section id="chat-section">
            <h2><img src="robot.svg" alt="StockBot" class="bot-icon-header"> Ask StockBot</h2>
            <div id="chat-log"></div>
            <input type="text" id="question-input" placeholder="Type your question...">
            <button id="ask-button">Send</button>
        </section>
    </main>

    <script src="app.js?v=2"></script>
</body>
</html>
