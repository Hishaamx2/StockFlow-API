name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore StockFlow/StockFlow.API/StockFlow.API.csproj

      - name: Build
        run: dotnet build StockFlow/StockFlow.API/StockFlow.API.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test StockFlow/StockFlow.API.Tests/StockFlow.API.Tests.csproj --configuration Release
